# Global benchmark configuration for all post-quantum signature crates.
#
# Every DSA crate in this workspace signs the same message so that
# benchmark results are directly comparable.  The raw string below is
# SHA-256-hashed at build time to produce a fixed 32-byte message
# digest that is used as the canonical signing input.

[bench]
message = "awesome-pq-signatures benchmark message"
# Workspace-wide security cohort for stateless schemes with comparable
# published parameter categories (for example ML-DSA, CROSS, LESS, MAYO, SPHINCS+).
# This scalar does not normalize stateful hash-based schemes. Those should be
# compared separately by security strength plus signing capacity/lifetime.
# Currently supported: "level1", "level3"
security_target = "level3"
# Stateful hash-based normalization uses a practical signing-capacity class
# rather than a NIST-style security category. Crates select the closest
# supported benchmark profile for this class and keep the exact chosen
# lifetime/tree parameter visible in docs and tables.
# Currently supported: "pow2_10", "pow2_20"
stateful_capacity_class = "pow2_10"
