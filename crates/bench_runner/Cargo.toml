[package]
name = "bench_runner"
version.workspace = true
edition.workspace = true

[[bin]]
name = "bench_runner"
path = "src/main.rs"

[dependencies]
csv = "1"
pq_bench = { path = "../pq_bench" }
serde_json = "1"

# Pure-Rust DSA crates (no C FFI)
dilithium = { path = "../dilithium" }
falcon = { path = "../falcon" }
sphincs_plus = { path = "../sphincs_plus" }
mayo = { path = "../mayo" }
lamport_ots = { path = "../lamport_ots" }
lms = { path = "../lms" }
hss = { path = "../hss" }
xmss-bench = { path = "../xmss" }
xmssmt-bench = { path = "../xmssmt" }

# External crates needed by adapters
pqcrypto-traits = "0.3"

# NOTE: cross, sqisign, less, and leansig run as standalone benchmark binaries.
# FFI crates avoid in-process global-state conflicts, and LeanSig stays out of
# the runner's direct dependency graph.
