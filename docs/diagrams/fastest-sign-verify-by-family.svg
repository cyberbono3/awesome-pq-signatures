<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Fastest Sign And Verify By Family</title>
  <desc id="desc">Families are shown as horizontal lanes, ordered internally by ascending signing time in milliseconds with verify time shown on each node.</desc>
  <style>
    .bg { fill: #f7f4ee; }
    .title { font: 700 28px Arial, sans-serif; fill: #1f2933; }
    .subtitle { font: 400 14px Arial, sans-serif; fill: #52606d; }
    .family { font: 700 18px Arial, sans-serif; fill: #102a43; }
    .small { font: 400 12px Arial, sans-serif; fill: #486581; }
    .node-title { font: 700 14px Arial, sans-serif; fill: #102a43; }
    .node-body { font: 400 12px Arial, sans-serif; fill: #243b53; }
    .lane { fill: #ffffff; stroke: #d9e2ec; stroke-width: 1; rx: 14; }
    .node { fill: #fffdf8; stroke: #bcccdc; stroke-width: 1.2; rx: 12; }
    .arrow { stroke: #7b8794; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .accent-code { fill: #d9f2e6; }
    .accent-hash { fill: #e8efff; }
    .accent-iso { fill: #fde8e8; }
    .accent-lattice { fill: #fff0d9; }
    .accent-system { fill: #f3e8ff; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 Z" fill="#7b8794"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="760"/>
  <text class="title" x="48" y="48">Fastest Sign And Verify By Family</text>
  <text class="subtitle" x="48" y="76">Each family is ranked left to right by ascending sign time in milliseconds. Verify time is shown inside each node.</text>

  <rect class="lane" x="36" y="106" width="1528" height="98"/>
  <rect class="accent-code" x="48" y="122" width="170" height="66" rx="12"/>
  <text class="family" x="64" y="150">Code-based</text>
  <text class="small" x="64" y="170">sign and verify order</text>
  <rect class="node" x="252" y="122" width="222" height="66" rx="12"/>
  <text class="node-title" x="268" y="146">#1 CROSS</text>
  <text class="node-body" x="268" y="164">sign 1.371 ms</text>
  <text class="node-body" x="268" y="180">verify 0.7868 ms</text>
  <path class="arrow" d="M474 155 H 528"/>
  <rect class="node" x="528" y="122" width="222" height="66" rx="12"/>
  <text class="node-title" x="544" y="146">#2 LESS</text>
  <text class="node-body" x="544" y="164">sign 19.06 ms</text>
  <text class="node-body" x="544" y="180">verify 18.69 ms</text>

  <rect class="lane" x="36" y="222" width="1528" height="170"/>
  <rect class="accent-hash" x="48" y="238" width="170" height="138" rx="12"/>
  <text class="family" x="64" y="266">Hash-based</text>
  <text class="small" x="64" y="286">sign and verify order</text>
  <rect class="node" x="252" y="238" width="214" height="56" rx="12"/>
  <text class="node-title" x="268" y="260">#1 LeanSig</text>
  <text class="node-body" x="268" y="277">sign 2.888 | verify 0.3607</text>
  <path class="arrow" d="M466 266 H 492"/>
  <rect class="node" x="492" y="238" width="214" height="56" rx="12"/>
  <text class="node-title" x="508" y="260">#2 HSS</text>
  <text class="node-body" x="508" y="277">sign 3.824 | verify 0.05408</text>
  <path class="arrow" d="M706 266 H 732"/>
  <rect class="node" x="732" y="238" width="214" height="56" rx="12"/>
  <text class="node-title" x="748" y="260">#3 LMS</text>
  <text class="node-body" x="748" y="277">sign 6.646 | verify 0.1026</text>
  <path class="arrow" d="M946 266 H 972"/>
  <rect class="node" x="972" y="238" width="230" height="56" rx="12"/>
  <text class="node-title" x="988" y="260">#4 SPHINCS+</text>
  <text class="node-body" x="988" y="277">sign 24.98 | verify 1.507</text>
  <rect class="node" x="252" y="310" width="214" height="56" rx="12"/>
  <text class="node-title" x="268" y="332">#5 XMSS</text>
  <text class="node-body" x="268" y="349">sign 3304 | verify 0.8081</text>
  <path class="arrow" d="M466 338 H 492"/>
  <rect class="node" x="492" y="310" width="230" height="56" rx="12"/>
  <text class="node-title" x="508" y="332">#6 XMSS^MT</text>
  <text class="node-body" x="508" y="349">sign 4762 | verify 1.795</text>

  <rect class="lane" x="36" y="410" width="1528" height="98"/>
  <rect class="accent-iso" x="48" y="426" width="170" height="66" rx="12"/>
  <text class="family" x="64" y="454">Isogeny-based</text>
  <text class="small" x="64" y="474">sign and verify order</text>
  <rect class="node" x="252" y="426" width="230" height="66" rx="12"/>
  <text class="node-title" x="268" y="450">#1 SQISign</text>
  <text class="node-body" x="268" y="468">sign 41.45 ms</text>
  <text class="node-body" x="268" y="484">verify 2.896 ms</text>

  <rect class="lane" x="36" y="526" width="1528" height="98"/>
  <rect class="accent-lattice" x="48" y="542" width="170" height="66" rx="12"/>
  <text class="family" x="64" y="570">Lattice-based</text>
  <text class="small" x="64" y="590">sign and verify order</text>
  <rect class="node" x="252" y="542" width="230" height="66" rx="12"/>
  <text class="node-title" x="268" y="566">#1 Falcon-512</text>
  <text class="node-body" x="268" y="584">sign 0.151 ms</text>
  <text class="node-body" x="268" y="600">verify 0.02161 ms</text>
  <path class="arrow" d="M482 575 H 536"/>
  <rect class="node" x="536" y="542" width="246" height="66" rx="12"/>
  <text class="node-title" x="552" y="566">#2 ML-DSA-65</text>
  <text class="node-body" x="552" y="584">sign 0.5695 ms</text>
  <text class="node-body" x="552" y="600">verify 0.04458 ms</text>

  <rect class="lane" x="36" y="642" width="1528" height="82"/>
  <rect class="accent-system" x="48" y="650" width="170" height="58" rx="12"/>
  <text class="family" x="64" y="676">System-of-equations</text>
  <rect class="node" x="252" y="650" width="220" height="58" rx="12"/>
  <text class="node-title" x="268" y="674">#1 MAYO-1</text>
  <text class="node-body" x="268" y="692">sign 2.04 | verify 0.7638</text>
</svg>
